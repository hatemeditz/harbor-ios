name: Release IPA

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods dependencies
        run: pod install --repo-update

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild -workspace Harbor.xcworkspace \
            -scheme Harbor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Harbor.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/Harbor.xcarchive/Products/Applications/Harbor.app" build/Payload/
          cd build
          zip -qry Harbor-${GITHUB_REF_NAME}.ipa Payload

      - name: Create GitHub Release and upload IPA
        uses: softprops/action-gh-release@v2
        with:
          files: build/Harbor-*.ipa
          generate_release_notes: true
