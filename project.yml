name: Harbor

options:
  bundleIdPrefix: site.harbor
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Harbor:
    type: application
    platform: iOS
    sources:
      - Harbor
    info:
      path: Harbor/Info.plist
      properties:
        CFBundleDisplayName: Harbor
        CFBundleShortVersionString: "0.9.4"
        CFBundleVersion: "5"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.harbor.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HarborTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HarborTests
    dependencies:
      - target: Harbor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  HarborUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HarborUITests
    dependencies:
      - target: Harbor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  Harbor:
    build:
      targets:
        Harbor: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HarborTests
        - HarborUITests
    archive:
      config: Release
